name: Build LVNM Releases

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    uses: ./.github/workflows/build-appimage.yml

  flatpak:
    uses: ./.github/workflows/build-flatpak.yml

  windows:
    uses: ./.github/workflows/build-windows.yml

  publish-release:
    needs: [appimage, flatpak, windows]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum LVNM-x86_64.AppImage LVNM-x86_64.flatpak LVNM-Windows-x86_64.zip > SHA256SUMS

      - name: Set Release Variables
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=LVNM ${{ github.ref_name }}" >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=continuous" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=Continuous Build" >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Check existing tagged release
        id: existing_release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME")
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Failed to check release for $TAG_NAME (HTTP $status)" >&2; exit 1 ;;
          esac

      - name: Prepare release notes
        if: github.ref_type != 'tag' || steps.existing_release.outputs.exists == 'false'
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            awk -v heading="## [$TAG_NAME]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
              END { if (!found) exit 1 }
            ' CHANGELOG.md > release-notes.md
          else
            printf 'Automated build for commit: %s\nDownload the AppImage, Flatpak bundle, or portable Windows zip below.\n' "$GITHUB_SHA" > release-notes.md
          fi

      - name: Move Continuous Tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f continuous
          git push -f origin continuous

      - name: Publish Release
        if: github.ref_type != 'tag' || steps.existing_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body_path: release-notes.md
          files: |
            LVNM-x86_64.AppImage
            LVNM-x86_64.flatpak
            LVNM-Windows-x86_64.zip
            SHA256SUMS
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
