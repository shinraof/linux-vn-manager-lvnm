name: Build LVNM Flatpak

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-flatpak:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install SDK, PySide base, graphics and codecs
        run: |
          flatpak install --user --noninteractive -y flathub \
            org.kde.Platform//6.11 \
            org.kde.Sdk//6.11 \
            io.qt.PySide.BaseApp//6.11 \
            org.freedesktop.Platform.codecs-extra//25.08-extra \
            org.freedesktop.Platform.Compat.i386//25.08 \
            org.freedesktop.Platform.GL32.default//25.08 \
            org.freedesktop.Platform.GL32.default//25.08-extra \
            org.freedesktop.Platform.codecs_extra.i386//25.08-extra \
            org.freedesktop.Platform.VulkanLayer.gamescope//25.08 \
            org.freedesktop.Platform.VulkanLayer.MangoHud//25.08

      - name: Build Flatpak repository
        run: |
          flatpak-builder --user --force-clean --repo=flatpak-repo \
            --install-deps-from=flathub flatpak-build \
            flatpak/io.github.uunniiblog.lvnm.yml

      - name: Create Flatpak bundle
        run: |
          flatpak build-bundle flatpak-repo LVNM-x86_64.flatpak \
            io.github.uunniiblog.lvnm \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Smoke test packaged application
        run: |
          timeout 30 flatpak-builder --run flatpak-build flatpak/io.github.uunniiblog.lvnm.yml \
            env QT_QPA_PLATFORM=offscreen python3 /app/share/lvnm/launcher.py --version
          timeout 30 flatpak-builder --run flatpak-build flatpak/io.github.uunniiblog.lvnm.yml \
            env QT_QPA_PLATFORM=offscreen python3 - <<'PY'
          import sys
          sys.path.insert(0, "/app/share/lvnm")
          from PySide6.QtCore import QTimer
          from PySide6.QtWidgets import QApplication
          import launcher
          original_window = launcher.MainWindow
          def checked_window():
              window = original_window()
              assert window.sidebar.count() == 5
              assert type(window.content_stack.widget(0)).__name__ == "GameTab"
              def finish():
                  assert window.isVisible()
                  assert not window.grab().isNull()
                  print("PASS: packaged LVNM window rendered", flush=True)
                  window.close()
                  QApplication.instance().quit()
              QTimer.singleShot(500, finish)
              return window
          launcher.MainWindow = checked_window
          sys.argv = ["lvnm"]
          launcher.main()
          PY

      - name: Generate checksum
        run: sha256sum LVNM-x86_64.flatpak > SHA256SUMS

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: |
            LVNM-x86_64.flatpak
            SHA256SUMS
          if-no-files-found: error
