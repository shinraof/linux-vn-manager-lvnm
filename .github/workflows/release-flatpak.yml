name: Release LVNM Flatpak

on:
  push:
    tags:
      - 'flatpak-v*'

permissions:
  contents: read

concurrency:
  group: flatpak-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Verify release version and notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = os.environ["RELEASE_TAG"].removeprefix("flatpak-")
          tree = ast.parse(Path("lvnm/config.py").read_text())
          version = next(ast.literal_eval(node.value) for node in tree.body
                         if isinstance(node, ast.Assign)
                         and any(isinstance(target, ast.Name) and target.id == "VERSION" for target in node.targets))
          assert version == expected, (version, expected)
          assert f"## [{expected}]" in Path("CHANGELOG.md").read_text()
          release = ET.parse("flatpak/io.github.uunniiblog.lvnm.metainfo.xml").find("releases/release")
          assert release.get("version") == expected.removeprefix("v")
          PY
      - name: Test Discord presence
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

  build:
    needs: validate
    uses: ./.github/workflows/build-flatpak.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flatpak
      - name: Verify bundle checksum and prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check SHA256SUMS
          test -s LVNM-x86_64.flatpak
          python - <<'PY'
          import os
          from pathlib import Path
          version = os.environ["RELEASE_TAG"].removeprefix("flatpak-")
          changelog = Path("CHANGELOG.md").read_text()
          notes = changelog.split(f"## [{version}]\n", 1)[1].split("\n## [", 1)[0].strip()
          notes += "\n\nInstall the attached Flatpak bundle:\n```bash\nflatpak install --user LVNM-x86_64.flatpak\nflatpak run io.github.uunniiblog.lvnm\n```\n\nFlatpak downloads the required runtimes from Flathub. Verify the download with the attached SHA256SUMS file.\n"
          Path("release-notes.md").write_text(notes)
          Path("release-title.txt").write_text(f"LVNM {version} — Flatpak")
          PY
          echo "RELEASE_TITLE=$(cat release-title.txt)" >> "$GITHUB_ENV"
      - name: Publish Flatpak release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TITLE }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            LVNM-x86_64.flatpak
            SHA256SUMS
